name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          mkdir -p site/home site/about site/contact
          cp views/home.html site/index.html
          cp views/home.html site/home/index.html
          cp views/about.html site/about/index.html
          cp views/contact.html site/contact/index.html
          cp views/404.html site/404.html
          cp public/styles.css site/styles.css

          base_path="/${GITHUB_REPOSITORY#*/}"
          for page in site/index.html site/home/index.html site/about/index.html site/contact/index.html site/404.html; do
            sed -i \
              -e "s|href=\"/styles.css\"|href=\"${base_path}/styles.css\"|g" \
              -e "s|href=\"/home\"|href=\"${base_path}/home/\"|g" \
              -e "s|href=\"/about\"|href=\"${base_path}/about/\"|g" \
              -e "s|href=\"/contact\"|href=\"${base_path}/contact/\"|g" \
              "$page"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
